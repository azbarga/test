
name: teacher_attendance
description: A Flutter project to manage teacher absences.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^1.10.25
  pdf: ^3.10.4
  printing: ^5.12.0
  share_plus: ^7.2.1
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  permission_handler: ^11.3.0
  excel: ^2.0.6
  file_saver: ^0.2.1+1
  flutter_local_notifications: ^9.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Cairo-Bold.ttf
